body: '> **Full spec and artifacts: [`.issues/374/`](https://github.com/michael-conrad/opencode-config/tree/issues-data/374)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.issues/374/` — full spec (`spec.md`), research evidence,
  implementation plan (when approved)


  ## Why


  The `.opencode` deck rip-and-replace (.opencode#2490 — stages 1–3 via #2492, stage
  4 via #2493) moved or retired deck content that parent-repo agent-facing documentation
  still references, and left the parent repo''s test instrument broken. Measured during
  the stage-4 post-merge sweep: dead reference rows, stale architecture descriptions,
  a claimed mechanical gate that no longer exists, a test instrument whose shared
  helper has been untracked since April 2026, and a submodule pointer two merges behind.


  ## The final what


  Parent-repo documentation and test instrument are made true again, verified fact-decidably:


  - `AGENTS.md` reference table and prose match the current submodule layout — `floor.md`/`routing.md`
  charter, pointer stub, card structure, trunk-only hook inventory; dead `.opencode/reference/*`
  rows and stale gate claims removed; the no-pointer-only-PR rule restated as policy.

  - The parent test instrument (`tests/behaviors/`) either runs green through the
  mandated harness entry point or is retired with the `AGENTS.md` instrument row aligned
  — no script fails at source time.

  - The submodule pointer advances to the `.opencode` trunk tip in the same commit
  as the content fixes (never pointer-only).

  - Historical records (`docs/auditor-model-qualification/`, `docs/unix-philosophy-skilldeck/`,
  `CHANGELOG.md`) remain byte-identical — point-in-time records stay untouched.


  Full success criteria (SC-1..SC-7 with verification instruments) and the measured
  defect inventory: [`spec.md`](https://github.com/michael-conrad/opencode-config/tree/issues-data/374/spec.md).


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

  '
