number: 196
title: '[SPEC] Replace .gitmodules-based submodule detection with filesystem glob
  scan in git-workflow tasks'
labels:
- SPEC
- plan
body: "## Plan for #196: Replace .gitmodules detection with filesystem glob scan\n\
  \n## Spec: #196\n\n## Phases\n\n### Phase 1: Core Detection Pattern + check-pr\n\
  - **Files:** `tasks/check-pr.md`\n- **Change:** Replace undefined `submodules` pseudo-code\
  \ with operational glob scan (`ls -d .git/ */.git/ */.git`), resolve remotes, query\
  \ all repos for PRs\n- **SC coverage:** SC-1, SC-2, SC-9\n\n### Phase 2: cleanup.md\
  \ + sub-tasks\n- **Files:** `tasks/cleanup.md`, `tasks/cleanup/branch-cleanup.md`,\
  \ `tasks/cleanup/issue-closure.md`\n- **Change:** Replace `.gitmodules` detection\
  \ in Step 0 with glob scan; update `branch-cleanup.md` Step 1.9 collection; `issue-closure.md`\
  \ Step 8.5 fallback uses glob-based `submodule_paths`\n- **SC coverage:** SC-1,\
  \ SC-3, SC-4, SC-9\n\n### Phase 3: Remaining task files\n- **Files:** `tasks/release-promotion.md`,\
  \ `tasks/review-prep/push-and-cleanup.md`, `tasks/pr-creation/enforcement-gate.md`,\
  \ `tasks/pre-work.md`, `tasks/provenance.md`\n- **Change:** Replace all `test -f\
  \ .gitmodules` gates and `git config --file .gitmodules` calls with glob scan\n\
  - **SC coverage:** SC-1, SC-5, SC-6, SC-7, SC-9\n\n### Phase 4: SKILL.md tag convention\n\
  - **Files:** `SKILL.md`\n- **Change:** Replace `.gitmodules` path reference in tag\
  \ suffix rule with discovered repo directory name\n- **SC coverage:** SC-1, SC-8,\
  \ SC-9\n\n## Core Detection Pattern (shared across all phases)\n\n```bash\nREPO_PATHS=$(ls\
  \ -d .git/ */.git/ */.git 2>/dev/null | sed 's|/$||')\nfor RP in $REPO_PATHS; do\n\
  \    REMOTE_URL=$(git -C \"$RP\" remote get-url origin 2>/dev/null || echo \"\"\
  )\n    # Parse owner/repo from SSH (git@github.com:owner/repo.git) or HTTPS (https://github.com/owner/repo.git)\n\
  done\n```\n\n## Dependencies\n- Phase 1 → Phase 2 → Phase 3 → Phase 4 (sequential)\n\
  - No external dependencies\n\n## PR Strategy\n- Single PR with 4 commits (one per\
  \ phase)\n- Target: dev\n"
