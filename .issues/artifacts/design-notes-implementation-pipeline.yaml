# Design Notes: implementation-pipeline Skill
# Saved 2026-05-25 during brainstorming session.
# Topic: Replace divide-and-conquer with serial orchestrator pipeline.
# See issue #909 for the spec.

## Agreed Design Decisions

### Item 1 — Skill Name
- **Name:** `implementation-pipeline`
- Rationale: Serial pipeline from regression baseline through implementation to delivery handoff. Not "divide-and-conquer" (implies decomposition/parallel). Not "orchestrator" (too broad). This is the serial TDD delivery sequence.

### Item 2 — YAML Contract Files
- Every pipeline step writes a YAML artifact to `./tmp/artifacts/`
- Sub-agents return ONLY a brief (status + recommendation) to the orchestrator
- Orchestrator reads YAML files ONLY when it needs to understand remediation scope on FAIL
- Sub-agents receive only the artifact filename(s) — they read from disk, never through orchestrator context
- Contract fields per step YAML:
  ```yaml
  step: <step_label>
  status: PASS|FAIL|BLOCKED
  evidence_paths:
    - ./tmp/artifacts/<filename>
  recommendation:
    target_step: <step_label>       # proceed or remediate
    scope: implementation_only|plan_and_implementation|spec_plan_and_implementation
    reason: "<brief justification, only on FAIL>"
  ```

### Item 3 — All Prior Contracts to Auditors/Double-Checks
- Auditors and double-checks receive the full chain of prior YAML artifacts
- Enables flow consistency checks: step skips, contract drift, gap between claimed intent and actual output
- Sub-agents glob for `pipeline-{issue}-*` in `./tmp/artifacts/` to discover the chain
- Orchestrator passes `issue_number` or `artifact_glob` — sub-agent reads from disk

### Item 4 — Step Labeling
- Steps referenced by stable YAML key labels, NOT by index number
- Labels used in filenames: `pipeline-{issue}-{step_label}-{timestamp}.yaml`
- Example: `pipeline-909-green-vbc-20260525T184200.yaml`
- Orchestrator globs `pipeline-909-*` to find all artifacts for an issue
- Step labels:
  - `sc-coherence-gate`
  - `pre-red-baseline`
  - `red-phase`
  - `red-doublecheck`
  - `green-phase`
  - `checkpoint-commit`
  - `structural-checks`
  - `green-doublecheck`
  - `green-vbc`
  - `adversarial-audit`
  - `cross-validate`
  - `regression-check`
  - `review-prep`
  - `exec-summary`

### Item 5 — Always YAML
- Every step produces a YAML artifact, even if only `status: PASS`
- File existence signals step completion
- Consistent interface across all 14 steps
- Location: `./tmp/artifacts/` (transient — vanishes = rerun)

### Item 6 — Orchestrator Context Hygiene
- Orchestrator holds only: `{status, artifact_path, recommendation}` per step
- Never loads full YAML content into orchestrator context
- Reads YAML only when FAIL requires remediation scope decision
- Sub-agents always read artifacts from disk (clean-room)

### Item 7 — SC Coherence Gate (Evidence Type Mismatch Detection)
- Step `sc-coherence-gate` must detect when an SC declares `structural` evidence type but the requirement describes runtime agent behavior that needs behavioral/functional testing
- This is a semantic check: the gate evaluates the spec's prose against the declared evidence type
- On detection: hard FAIL — blocks the pipeline
- Orchestrator dispatches researcher sub-agent with the spec artifact
- Researcher determines the correct evidence type and produces a remediation artifact with `remediation_scope: spec_plan_and_implementation`
- Orchestrator routes back through spec revision → plan revision → implementation
- Evidence type mismatch is NOT a warning — it is a hard gate that prevents wasted implementation against misclassified SCs

### Item 6b — Remediation via Researcher Skill
- On FAIL at any gate, orchestrator dispatches the **researcher** skill (dedicated skill card, not general sub-agent)
- Researcher is generally available for ALL types of research — not just pipeline remediation
- Always does exhaustive research: better to spend time investigating than repeat work
- Researcher always saves a YAML-frontmatter + markdown-body artifact (`pipeline-{issue}-researcher-{topic}-{STATUS}-{timestamp}.md` or general `research-{topic}-{STATUS}-{timestamp}.md`)
- Saved artifacts allow future sessions to reference prior research without re-doing it
- NO arbitrary attempt cap (no "3 tries then escalate")
- Researcher receives:
  - The failure YAML artifact from the step that FAILed
  - ALL prior pipeline YAML artifacts for the issue
  - The original spec artifact (spec YAML/issue body + SCs + evidence types)
  - The plan artifact
- Researcher can look outward: API docs, library signatures, contract definitions, web research
- Researcher produces a remediation artifact with YAML frontmatter + markdown body
- Format: `pipeline-{issue}-researcher-remediation-{STATUS}-{timestamp}.md`
- YAML frontmatter (machine-readable for orchestrator routing):
  ```yaml
  ---
  step: researcher-remediation
  triggered_by_step: <step_label>
  failure_artifact: <path>
  prior_artifacts_consulted:
    - <path>
    - <path>
  remediation_scope: implementation_only|plan_and_implementation|spec_plan_and_implementation
  remediation_steps:
    - target_step: <step_label>
      notes: "<what needs to change>"
  escalation_required: false
  ---
  ```
- Markdown body (human/AI-readable for evidence and audit trail):
  ```markdown
  ## Research Summary

  <concise summary of the failure and what was found>

  ## Findings

  ### Finding 1: <title>
  - **Evidence:** <specific evidence with tool call output>
  - **Source:** <verifiable URL or file path>
  - **Verification method:** <how the source was confirmed>

  ### Finding 2: <title>
  - ...

  ## Remediation Rationale

  <why this particular scope (impl vs plan+impl vs spec+plan+impl) was chosen>

  ## Sources Consulted

  | Source | URL/Path | What It Confirmed | Verification Method |
  |--------|----------|-------------------|---------------------|
  | API docs | <url> | ... | Fetched on <date>, response 200 |
  | Spec issue | <url> | ... | Read full issue body |
  | Library source | <path> | ... | `srclight_get_signature` |
  ```
- Sources MUST be verifiable — URLs must be fetched and confirmed responsive, file paths must be confirmed via `read`/`srclight_*`
- Orchestrator reads the YAML frontmatter for routing, passes the full artifact path to downstream steps for audit trail
- Escalation to developer ONLY when `escalation_required: true` — researcher found an unresolvable blocker (conflict, missing API, contradictory specs)
- No "try 3 times" wall — each remediation is a fresh intelligent investigation

### Item 8 — Pipeline State Tracking (Option B: Cumulative state in YAML + status in slug)
- Each YAML filename includes status: `pipeline-{issue}-{step_label}-{STATUS}-{timestamp}.yaml`
- Glob patterns:
  - `pipeline-909-*` — all artifacts
  - `pipeline-909-*-PASS-*` — completed steps
  - `pipeline-909-*-FAIL-*` — failed steps (read first on resume)
  - `pipeline-909-structural-checks-*` — specific step regardless of status
- Each YAML file contains a `pipeline_state` section with cumulative status of all completed steps:
  ```yaml
  pipeline_state:
    completed_steps:
      sc-coherence-gate: PASS
      pre-red-baseline: PASS
      red-phase: PASS
      red-doublecheck: PASS
    current_step: green-phase
    remaining_steps:
      - checkpoint-commit
      - structural-checks
      - green-doublecheck
      - green-vbc
      - adversarial-audit
      - cross-validate
      - regression-check
      - review-prep
      - exec-summary
  ```
- Sub-agent writing the YAML globs prior artifacts, reads each `status`, and appends its own step
- Orchestrator reads the latest artifact by glob → sort by timestamp → state is complete in one file
- On session resume: glob → sort → find last artifact → if FAIL, dispatch researcher with artifact path
- No context-dependent routing — orchestrator always routes based on on-disk state
- **Session resume rule:** if latest artifact is FAIL and a `researcher-remediation-PASS` artifact exists for that FAIL step, follow the remediation plan's `remediation_steps[0].target_step` — do NOT re-dispatch the researcher
- If latest artifact is FAIL and NO researcher-remediation artifact exists, dispatch researcher

### Item 9 — Z3 Symbolic Verification (#872 Integration)
- Pipeline YAML artifacts in `./tmp/artifacts/` are **descriptive** (record what happened), not **prescriptive** (what must be true)
- They do NOT need to be Z3-verifiable themselves — they are evidence records for sub-agents and auditors
- Z3 integration (from #872) is a separate layer:
  - SC coherence gate can dispatch `solve --file` against spec's `constraints.yaml` to validate SC consistency
  - Pipeline state machine validation could use Z3 to verify artifact sequences form legal transitions (future)
  - Researcher can produce Z3-validatable constraint fragments for remediation paths
- The contract schema as designed (YAML artifacts) is sufficient — no Z3 schema changes needed

### Item 10 — Phase Breakdown (Merge Groups + Reload Points)

Parent issue tracks all phases. Phases grouped into merge groups that must land together. No backwards compatibility shim — rename is atomic.

#### Merge Group A (Phases 1+2 — must merge together)
- Phase 1: Rename `divide-and-conquer` → `implementation-pipeline` + cross-reference sweep
- Phase 2: YAML contract artifact infrastructure (task files under new directory)
- Cannot merge separately: rename alone breaks all `skill({name: "divide-and-conquer"})` calls
- **Reload point:** After this merges — cached skill data stale, restart clean-room with design notes + artifact

#### Merge Group B (Phases 3+6 — independent, can merge before or after A)
- Phase 3: New `researcher` skill card (dedicated, general-purpose)
- Phase 6: Cross-validate revision per #834 alignment
- Both touch files that A does not touch (new skill file, existing cross-validate.md)
- **Reload point:** After this merges — new `researcher` skill cached, restart clean-room

#### Merge Group C (Phases 4+5+7 — depends on A)
- Phase 4: SC coherence gate (evidence type mismatch detection)
- Phase 5: Remediation routing (FAIL → researcher dispatch)
- Phase 7: Behavioral tests (tests integrated pipeline, merges last)
- **Reload point:** After this merges — pipeline fully wired, full behavioral test suite runnable

#### Merge Group D (Phase 8 — depends on #872)
- Phase 8: Z3 integration point (SC coherence gate dispatching `solve --file`)
- Depends on #872 landing first (constraints.yaml format must exist)
- **Reload point:** After this merges — Z3 tooling available for pipeline

#### Reload Protocol
- Any PR touching `.opencode/skills/` or `.opencode/guidelines/` invalidates cached skill/guideline data
- After PR merges, agent MUST restart fresh — not continue same session
- Saved context for restart:
  - `./tmp/design-notes-implementation-pipeline.yaml` — full design
  - `./tmp/artifacts/pipeline-{parent-issue}-{merge-group}-{STATUS}-*.yaml` — what was done
- GitHub issue URL for parent spec (#909)
- GitHub issue URLs for completed sub-issues (#915, #913, #912, #914)
- Artifact chain makes restart lossless — orchestrator globs latest artifact, reads pipeline_state, resumes from current_step

### Item 11 — Approval + Reload Order

Each item requires its own authorization (no cascade from parent). #872 first — constraint tooling available for pipeline phases. A and B can parallel after #872. C waits for A. D waits for #872 + C.

| Order | Item | Issue | Authorization | Can Start | Depends On |
|-------|------|-------|---------------|-----------|------------|
| 1 | Z3 tooling | #872 | `for_pr` | Anytime | Nothing — do first |
| 2 | A | #915 | `for_pr` | After #872 | Nothing (parallel with B) |
| 3 | B | #913 | `for_pr` | After #872 | Nothing (parallel with A) |
| 4 | C | #912 | `for_pr` | After A + #872 | #915 merged, #872 merged |
| 5 | D | #914 | `for_pr` | After #872 + C | #872 merged, #912 merged |

Reload sequence:
1. PR #915 merges → RELOAD
2. PR #913 merges → RELOAD (order vs #915 doesn't matter)
3. PR #912 merges → RELOAD
4. PR #872 merges → RELOAD (if #872 not yet merged)
5. PR #914 merges → RELOAD

On each reload: restart clean-room with `./tmp/design-notes-implementation-pipeline.yaml` + artifact chain. Agent globs latest, reads pipeline_state, continues from current_step.
