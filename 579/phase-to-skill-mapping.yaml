# Phase-to-skill mapping per #1311 format
# Generated by structure task from writing-plans
schema_version: "1.0"
mappings:
  - phase: pre
    name: Skill scaffold — SKILL.md creation
    concern: Create skill directory structure and SKILL.md with frontmatter, overview, persona, trigger dispatch table, tasks list, invocation, authorization model
    skill: skill-creator
    task: create
    reason: New skill creation — SKILL.md with all required sections
    files:
      - .opencode/skills/upstream-report/SKILL.md
    sc_coverage:
      - SC-1: skill exists at correct path
      - SC-9: authorization model documented

  - phase: 1
    name: Context classifier gate — classify.md
    concern: Gate that distinguishes internal bugs from upstream reports, routes to correct workflow
    skill: skill-creator
    task: create
    reason: New task file for context classification logic
    files:
      - .opencode/skills/upstream-report/tasks/classify.md
    sc_coverage:
      - SC-2: context classifier gate routes correctly

  - phase: 2
    name: Upstream repo resolution — resolve-target.md
    concern: Determine upstream owner/repo with fallback when fork detection unavailable
    skill: skill-creator
    task: create
    reason: New task file for target resolution with fallback
    files:
      - .opencode/skills/upstream-report/tasks/resolve-target.md
    sc_coverage:
      - SC-8: dependency on #601 declared

  - phase: 3
    name: Template discovery — discover-template.md
    concern: Fetch upstream .github/ISSUE_TEMPLATE/bug-report.md and respect its structure
    skill: skill-creator
    task: create
    reason: New task file for template fetching and parsing
    files:
      - .opencode/skills/upstream-report/tasks/discover-template.md
    sc_coverage:
      - SC-3: template discovery and respect

  - phase: 4
    name: Content stripping — strip-content.md
    concern: Remove RCA, fix suggestions, botsplaining, internal implementation details
    skill: skill-creator
    task: create
    reason: New task file for content stripping rules
    files:
      - .opencode/skills/upstream-report/tasks/strip-content.md
    sc_coverage:
      - SC-4: content stripping rules

  - phase: 5
    name: Claim verification — verify-claims.md
    concern: Verify reproduction claims against live sources before filing
    skill: skill-creator
    task: create
    reason: New task file for claim verification workflow
    files:
      - .opencode/skills/upstream-report/tasks/verify-claims.md
    sc_coverage:
      - SC-5: claim verification against live sources

  - phase: 6
    name: Platform filing — file-report.md
    concern: File report via correct platform API (GitHub MCP or gb CLI)
    skill: skill-creator
    task: create
    reason: New task file for platform-aware filing
    files:
      - .opencode/skills/upstream-report/tasks/file-report.md
    sc_coverage:
      - SC-6: platform-aware filing

  - phase: 7
    name: Local tracking — track-local.md
    concern: Create .issues/ tracking entry mirroring filed report
    skill: skill-creator
    task: create
    reason: New task file for local tracking
    files:
      - .opencode/skills/upstream-report/tasks/track-local.md
    sc_coverage:
      - SC-7: local tracking entry

  - phase: 8
    name: Completion — completion.md
    concern: Standard completion workflow — push, URL, lifecycle event, executive summary
    skill: skill-creator
    task: create
    reason: New task file for completion
    files:
      - .opencode/skills/upstream-report/tasks/completion.md
    sc_coverage: []

  - phase: post
    name: Behavioral tests + finishing
    concern: Behavioral enforcement tests for SC-2 through SC-7, finishing checklist, PR creation
    skill: test-driven-development
    task: behavioral-test
    reason: Behavioral tests for all behavioral SCs
    files:
      - .opencode/tests/behaviors/579-sc2-context-classifier.sh
      - .opencode/tests/behaviors/579-sc3-template-discovery.sh
      - .opencode/tests/behaviors/579-sc4-content-stripping.sh
      - .opencode/tests/behaviors/579-sc5-claim-verification.sh
      - .opencode/tests/behaviors/579-sc6-platform-filing.sh
      - .opencode/tests/behaviors/579-sc7-local-tracking.sh
    sc_coverage:
      - SC-2: behavioral test for context classifier
      - SC-3: behavioral test for template discovery
      - SC-4: behavioral test for content stripping
      - SC-5: behavioral test for claim verification
      - SC-6: behavioral test for platform filing
      - SC-7: behavioral test for local tracking
