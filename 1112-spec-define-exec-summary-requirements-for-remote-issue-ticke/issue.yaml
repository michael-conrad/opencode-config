title: '[SPEC] Define exec summary requirements for remote issue tickets in spec-creation'
status: open
labels:
- SPEC
body: '## Intent and Executive Summary


  | Field | Value |

  |-------|-------|

  | Problem | Spec-creation skill''s `write.md` Step 7 defines only a chat output
  format for spec results. It has no definition of what the remote issue ticket body
  should contain when the canonical spec lives in a local artifact. This creates inconsistent,
  incomplete stakeholder-facing issue bodies across projects. |

  | Approach | Define a 6-part mandatory exec summary body structure for any remote
  issue ticket (platform-agnostic: GitHub, GitBucket, Jira, etc.) and update `spec-creation/write.md`
  and related skills to enforce it. |

  | Key Decisions | Platform-agnostic — no hardcoded GitHub/GitBucket tool names;
  all links are full resolved URLs from session-init; repo-awareness guard required
  to prevent cross-repo link errors |

  | Alternatives | Keep current freeform approach (rejected: produces inconsistent
  stakeholder-facing docs). Use platform-specific templates (rejected: violates platform-agnostic
  mandate). |

  | Scope | spec-creation write.md task, issue-operations creation task, and any other
  skill that creates remote issue body content |


  ## Problem


  The `spec-creation/write.md` Step 7 defines only the chat output format for when
  a spec is created (brief exec summary + URL + byline in chat output). It does NOT
  define what the remote issue ticket body should contain when the canonical spec
  lives in a local artifact (`.issues/N/spec.md` on `issues-data` branch). This gap
  means:


  - Stakeholder-facing issue bodies are inconsistent across repos

  - AI agents lack a clear directive to read the local spec, not the exec summary

  - No spec reference blockquote exists pointing to the local artifact

  - Links use platform-specific shortcuts instead of full resolved URLs

  - No repo-awareness guard prevents cross-repo link errors

  - Step 7 conflates two outputs (remote issue creation and chat output) into a single
  step

  - Step 7 only knows about `github_issue_write` as the persistence mechanism, ignoring
  the local `.issues/N/spec.md` mirror requirement

  - Step 3 defines a 4-column SC table format (ID, Criterion, Verification Method,
  Remediation) that conflicts with the 12-column format used elsewhere in the skill


  ## Requirements


  ### R-1: Remote Issue Body Structure


  Every remote issue ticket body created by `issue-operations` MUST include the following
  sections, in order:


  #### 1. Spec Reference Blockquote (mandatory — top of body, before all other content)


  ```

  > Full spec and plan artifacts: {{REMOTE_BROWSER_URL}}/{{OWNER}}/{{REPO}}/tree/{{SPEC_BRANCH}}/{{SPEC_PATH}}

  ```


  Resolution rules:

  - `{{REMOTE_BROWSER_URL}}` — resolved from session-init (platform-agnostic)

  - `{{OWNER}}` / `{{REPO}}` — resolved from session-init, verified against the target
  issue''s repo context

  - `{{SPEC_BRANCH}}` — always `issues-data`

  - `{{SPEC_PATH}}` — always `.issues/N/`


  Repo-awareness guard: before resolving, confirm `owner`/`repo` matches the target
  issue''s repository. All links MUST be full resolved URLs — no platform-specific
  shortcuts (`#NNN`, `owner/repo#NNN`).


  #### 2. Problem (mandatory)

  #### 3. Scope (mandatory)

  #### 4. Approach (mandatory)

  #### 5. Impact (mandatory)

  #### 6. AI Agent Instructions (mandatory)


  ### R-2: Constraints


  | Constraint | Value |

  |------------|-------|

  | Length | 150-300 words, 1 page max |

  | Structure | BLUF |

  | Tone | Assertive, decision-oriented, jargon-free, third-person |

  | Independence | Fully readable without clicking any link |

  | Links | Full resolved URLs from session-init only. Repo-awareness guard required.
  |

  | Exclusions | No implementation details, file paths, algorithms, methodology |

  | Platform | Platform-agnostic |


  ### R-3: Changes to spec-creation/write.md


  1. Add "Remote Issue Body Format" section defining the 6-part structure

  2. Keep Step 7 chat output format as-is

  3. Add AI Agent Instructions section requirement

  4. Add spec reference blockquote requirement

  5. Add full URL requirement with repo-awareness guard

  6. Add tone/length/exclusions constraints table

  7. Clarify 5-field preamble belongs in local spec only

  8. Resolve SC table format discrepancy between Step 3 (4-column) and 12-column format

  9. Add local spec persistence to `.issues/N/spec.md` as companion to remote issue
  creation


  ### R-4: Changes to other skills


  - `issue-operations` creation task: MUST implement exec summary body structure


  ### R-5: Minimize redesign surface


  Do NOT change pipeline flow, sub-agent routing, or task decomposition.


  ## Out of Scope


  - Local spec format changes

  - brainstorming, spec-audit, adversarial-audit changes

  - Sub-agent routing or pipeline flow changes


  ## Success Criteria


  | ID | Criterion | Evidence Type |

  |----|-----------|---------------|

  | SC-1 | write.md has "Remote Issue Body Format" section with 6-part structure |
  `string` |

  | SC-2 | write.md has AI Agent Instructions requirement | `string` |

  | SC-3 | write.md has spec reference blockquote with repo-awareness guard | `string`
  |

  | SC-4 | write.md has full URL requirement (no shortcuts) | `string` |

  | SC-5 | write.md has tone/length/exclusions constraints table | `string` |

  | SC-6 | write.md clarifies 5-field preamble belongs in local spec only | `string`
  |

  | SC-7 | issue-operations creation task produces exec summary bodies with 6-part
  structure | `behavioral` |

  | SC-8 | issue body contains full resolved URL to local spec artifact | `behavioral`
  |

  | SC-9 | issue body contains AI Agent Instructions section | `behavioral` |

  | SC-10 | No hardcoded platform-specific tool names in exec summary formatting |
  `string` |

  | SC-11 | Existing behavioral tests for spec-creation and issue-operations still
  pass | `behavioral` |

  | SC-12 | Step 3 SC table format consistent with 12-column format used elsewhere
  | `string` |

  | SC-13 | Step 7 includes local spec persistence to `.issues/N/spec.md` | `string`
  |


  '
