spec: https://github.com/michael-conrad/opencode-config/issues/279
revision_re_entry:
  revision_scopes:
    - scope: full
      cascade_artifacts:
        - plan.md
        - sc-summary.yaml
        - verification-consistency-contract.yaml
      requires_re_approval: true
      valid_re_entry_steps:
        - step: Phase 1
      constraints:
        - 'on_full_revision: all_artifacts_must_be_regenerated'
    - scope: partial
      cascade_artifacts:
        - plan.md
        - sc-summary.yaml
      requires_re_approval: true
      valid_re_entry_steps:
        - step: Phase 1
        - step: Phase 2
        - step: Phase 3
        - step: Phase 4
      constraints:
        - 'on_partial_revision: cascade_is_limited_to_affected_scs'
