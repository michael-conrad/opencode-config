body: "---\ntitle: '[SPEC] Fix writing-plans family — remove 2 sub-skill stubs, per-step\
  \ dispatch'\nstatus: draft\ncreated: 2026-07-21\nlicense: MIT\nprovenance: AI-generated\n\
  issue: 321\nauthors:\n  - OpenCode (deepseek-v4-flash)\n---\n\n> STATUS: **DRAFT**\n\
  > CREATED: 2026-07-21\n\n> **Compliance requirement:** This is a fix spec (F-5).\
  \ It modifies the writing-plans family skill cards and their task files. All changes\
  \ MUST conform to the canonical templates defined in T-1 (issue #318) and T-2 (issue\
  \ #316).\n\n> **Master spec reference:** See `tmp/spec-per-step-dispatch.md` for\
  \ the full interdependency analysis, dispatch vocabulary, and shared definitions.\n\
  \n## Problem\n\nThe writing-plans skill card routes 1 task reference through 2 sub-skill\
  \ SKILL.md files (writing-plans-creation, writing-plans-holistic). Each sub-skill\
  \ is a stub with no dispatch information — they list task filenames with no TDT,\
  \ no workflows, no dispatch instructions.\n\nThis sub-skill indirection is dead\
  \ weight. The task files are referenced by path from the parent TDT and should be\
  \ referenced directly. Additionally, all 3 skill cards have the global Invocation/DISPATCH_GATE\
  \ defect.\n\n## Scope\n\nThis spec covers the writing-plans family: writing-plans,\
  \ writing-plans-creation, and writing-plans-holistic skill cards and their ~20 task\
  \ files.\n\n**Out of scope:** Other skill cards (covered by F-1 through F-4, F-6,\
  \ F-7). Behavioral enforcement tests (covered by issue #326). Removal of the 2 orphaned\
  \ sub-skill SKILL.md files (covered by C-1, issue #323).\n\n## Key Changes\n\n1.\
  \ Add `## Pre-Flight Gate` section to all 3 skill cards\n2. Remove global `## Invocation`\
  \ and `## DISPATCH_GATE` sections from all 3 skill cards\n3. Update `writing-plans/SKILL.md`\
  \ TDT to reference task files by direct path instead of `--task` qualifiers\n4.\
  \ Add enumerated workflow sections with per-step dispatch for each writing-plans\
  \ workflow\n5. Add Dispatch Contract, Output Contract, and Frugal Contract to all\
  \ ~20 task files\n6. Remove \"dispatch via task()\" language from Overview and Persona\
  \ sections\n\n## Affected Files\n\n| File | Change |\n|------|--------|\n| `writing-plans/SKILL.md`\
  \ | Add Pre-Flight Gate, remove Invocation/DISPATCH_GATE, update TDT to direct paths,\
  \ add workflows |\n| `writing-plans-creation/SKILL.md` | Add Pre-Flight Gate, remove\
  \ Invocation/DISPATCH_GATE, add workflows |\n| `writing-plans-holistic/SKILL.md`\
  \ | Add Pre-Flight Gate, remove Invocation/DISPATCH_GATE, add workflows |\n| `writing-plans/tasks/*.md`\
  \ (~10 files) | Add contract sections |\n| `writing-plans-creation/tasks/*.md` (~5\
  \ files) | Add contract sections |\n| `writing-plans-holistic/tasks/*.md` (~5 files)\
  \ | Add contract sections |\n\n## Success Criteria\n\n| ID | Criterion | Evidence\
  \ Type |\n|----|-----------|---------------|\n| SC-1 | All 3 skill cards have Pre-Flight\
  \ Gate as first content section | `string` |\n| SC-2 | All 3 skill cards have no\
  \ global Invocation or DISPATCH_GATE section | `string` |\n| SC-3 | `writing-plans/SKILL.md`\
  \ TDT references task files by direct path, not `--task` qualifiers | `string` |\n\
  | SC-4 | All 3 skill cards have enumerated workflow sections with per-step dispatch\
  \ | `string` |\n| SC-5 | All ~20 task files have Dispatch Contract, Output Contract,\
  \ and Frugal Contract sections | `string` |\n| SC-6 | No \"dispatch via task()\"\
  \ language in lead-in sections | `string` |\n\n## Dependencies\n\n- **BLOCKED by\
  \ T-1 (issue #318):** Canonical skill card structure template must be defined first\n\
  - **BLOCKED by T-2 (issue #316):** Canonical task card structure template must be\
  \ defined first\n- **Prerequisite for C-1 (issue #323):** Cleanup spec must wait\
  \ until parent TDT references task files directly\n\n## Implementation Order\n\n\
  ```\nPhase 1: T-1, T-2 (templates) — prerequisite\nPhase 2: F-1 (audit) — proof\
  \ of concept\nPhase 3: F-5 (this spec) — parallel with F-2, F-3, F-4, F-6, F-7\n\
  Phase 4: C-1 (cleanup) — blocked until F-2 through F-5 complete\n```\n"
