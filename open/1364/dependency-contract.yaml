# Dependency contract — issue #1364
# Generated by writing-plans research task from interface-compatibility.yaml dependency_contract
# (for_pr scope model bypasses plan execution). 5 SCs across 3 phases.
variables:
  phase_1:
    type: bool
    description: >-
      Create executing-plans skill with plan-reading mandate — SC-5. Executing-plans/
      does not exist in the deck yet; this is the foundational prerequisite for the
      behavioral SCs (SC-1, SC-2) and the routing rule (SC-4).
  phase_2:
    type: bool
    description: >-
      Update approval-gate authorization scope model table (Pre-Flight + Pipeline columns,
      remove auto-PR) and add the for_pr-with-existing-plan routing rule — SC-3, SC-4.
  phase_3:
    type: bool
    description: >-
      Behavioral enforcement of for_pr routing (existing plan and missing plan scenarios)
      — SC-1, SC-2. opencode-cli run -> stderr shows executing-plans dispatch; no direct
      git commit / github_create_pull_request.
preconditions:
  - "z3.Implies(phase_2, phase_1)"
  - "z3.Implies(phase_3, phase_1)"
  - "z3.Implies(phase_3, phase_2)"
invariants: []
postconditions: []
phases:
  phase_1:
    files:
      - .opencode/skills/executing-plans/SKILL.md
    scs:
      - SC-5
  phase_2:
    files:
      - .opencode/skills/approval-gate/SKILL.md
    scs:
      - SC-3
      - SC-4
  phase_3:
    files:
      - .opencode/tests-v2/behaviors/
    scs:
      - SC-1
      - SC-2
edges:
  - from: phase_1
    to: phase_2
    rationale: >-
      The routing rule (SC-4) dispatches executing-plans; the skill must exist (Phase 1,
      SC-5) before the routing rule referencing it is coherent. SC-3 table edit is colocated
      in approval-gate/SKILL.md and shipped in the same phase.
  - from: phase_1
    to: phase_3
    rationale: >-
      Behavioral tests dispatch executing-plans; the skill must exist (Phase 1, SC-5)
      before the tests can observe the dispatch in stderr.
  - from: phase_2
    to: phase_3
    rationale: >-
      Behavioral tests verify the routing behavior enabled by the routing rule (SC-4); the
      rule must be present (Phase 2) before the behavior is observable.
notes:
  - >-
    executing-plans/ is not currently present in the skill deck (verified by
    ls .opencode/skills/executing-plans/ -> no such directory). SC-1, SC-2, SC-5 depend on
    it. Phase 1 creates it as the foundation.
  - >-
    The actual approval-gate/SKILL.md Authorization Scope Model table currently uses
    columns (Scope | HALT After | PR Strategy) without a gap-fill/pre-flight/pipeline
    column (verified by grep). The spec's target state (Pre-Flight + Pipeline columns) is
    implemented in Phase 2 (SC-3).
