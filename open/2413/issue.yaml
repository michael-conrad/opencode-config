title: '[BUG] interface-compatibility.yaml artifact missing dependency_contract section
  blocks writing-plans research'
status: open
labels:
- approved-for-for_pr
- spec-cleared
body: '> Full spec and plan artifacts: https://github.com/michael-conrad/.opencode/tree/issues-data/{N}/


  ## Problem


  The `interface-compatibility.yaml` analytical artifact generated by the **spec-creation
  pipeline** is missing the required `dependency_contract` section, which blocks the
  writing-plans research step and halts the entire plan pipeline. Writing-plans `research.md`
  step 9 requires `interface-compatibility.yaml` to carry a `dependency_contract`
  section, which it extracts into `dependency-contract.yaml` for the Z3 `solve`/`plan`
  tools. When the artifact lacks this section, research returns BLOCKED with `DEPENDENCY_CONTRACT_NOT_FOUND`
  and plan creation cannot proceed without manual backfill.


  ## Scope


  - Ensure the spec-creation pipeline''s `interface-compatibility.yaml` artifact always
  emits a `dependency_contract` section (via the artifact-generation step or the artifact
  template/contract).

  - Alternatively, update the writing-plans `research.md` step 9 to detect the missing
  section and auto-backfill it rather than hard-blocking.

  - Verify the forward spec-creation artifact path (not just the retroactive backfill
  path) is covered.


  **Out of scope:** changes to the retroactive backfill path already addressed by
  closed issue #2311 / PR #2316; behavioral changes to the Z3 constraint solving pipeline.


  ## Approach


  The root cause is that the spec-creation analytical-artifact generation (interface-compatibility
  produced via the brainstorming/spec-creation `top-down-analysis` artifact production)
  emits only `interfaces`/`removed_interfaces`/`breaking_changes` keys, while the
  writing-plans `research.md` consumer expects a `dependency_contract` section. Closed
  #2311 fixed only the backfill path (`backfill.md` producer → `research.md` consumer),
  not the forward spec-creation path. Two viable fixes: (1) the spec-creation artifact-generation
  step or the `interface-compatibility.yaml` template/contract always emits a `dependency_contract`
  section populated with concrete dependency data, or (2) `research.md` step 9 auto-backfills
  the contract from the existing artifact keys instead of hard-blocking. Either path
  must be verified against the actual spec-creation artifact-generation code rather
  than assumed fixed.


  ## Impact


  - **Risk 1:** Any spec whose spec-creation-generated `interface-compatibility.yaml`
  lacks `dependency_contract` will block the plan pipeline at research step 9. *Mitigation:*
  fix at the generation point so all new specs produce the section.

  - **Risk 2:** Auto-backfill could diverge from the exact contract schema the `solve`/`plan`
  tools expect. *Mitigation:* cross-check against `skills/writing-plans/contracts/`
  templates during implementation.

  - **Risk 3:** Regression of the closed #2311 backfill fix. *Mitigation:* keep scope
  limited to the forward spec-creation path; verify both producer/consumer sides agree.


  **Call to action:** Approve this BUG fix so plan creation does not require manual
  `dependency_contract` backfill for spec-creation-generated artifacts.


  ## Root Cause


  The `dependency_contract` section is expected by `research.md` step 9 (lines 41-43)
  but is never emitted by the spec-creation pipeline''s forward `interface-compatibility.yaml`
  artifact generation. Evidence from `.opencode#2411`: the generated artifact contained
  only `interfaces`/`removed_interfaces`/`breaking_changes` keys and no `dependency_contract`
  section (grep count = 0), and research returned BLOCKED with `DEPENDENCY_CONTRACT_NOT_FOUND`.
  The section had to be manually backfilled before research could proceed.


  ## Success Criteria


  - SC-1: A spec-creation-generated `interface-compatibility.yaml` artifact always
  contains a `dependency_contract` section (or `research.md` step 9 auto-backfills
  it instead of hard-blocking).

  - SC-2: The spec-creation producer and writing-plans research consumer agree on
  the `interface-compatibility.yaml` schema.

  - SC-3: Plan creation for a spec whose `interface-compatibility.yaml` was generated
  by the forward spec-creation path proceeds without hitting `DEPENDENCY_CONTRACT_NOT_FOUND`.


  ## Affected Files


  - `.opencode/skills/spec-creation/tasks/analyze.md` (or the interface-compatibility
  artifact template/contract)

  - `.opencode/skills/brainstorming/` (`top-down-analysis` artifact production)

  - `.opencode/skills/writing-plans/tasks/research.md` (step 9, if auto-backfill path
  chosen)


  ## Evidence


  - `.opencode#2411` plan creation: research returned BLOCKED with `DEPENDENCY_CONTRACT_NOT_FOUND`.

  - `interface-compatibility.yaml` contained only `interfaces`/`removed_interfaces`/`breaking_changes`
  keys; grep for `dependency_contract` count = 0.

  - Section manually backfilled before research could proceed.

  - Closed #2311 (PR #2316) fixed only the backfill path; the forward spec-creation
  generation path remains broken.


  🤖 OpenCode (deepseek-ai/DeepSeek-V4-Flash-0731) created

  '
