tooling_note: >-
  The bot walls (Cloudflare "Just a moment"/429, JSTOR "Client Challenge") defeat
  curl, JSON APIs, and headless-chromium deep links, but a HEADED chromium session
  with a durable persistent profile (playwright-cli open --headed --browser chromium
  --persistent --profile ~/.local/share/opencode/pw-profile) clears them: navigate
  to each site's homepage first (warm cookies), then search via the site's own form
  — deep-link search URLs worked only after homepage warm-up. Profile now lives at
  ~/.local/share/opencode/pw-profile and carries no JSTOR/WorldCat login (only
  warmed anonymous sessions); a one-time interactive login is the developer's step.

likely_real_sources_of_the_citation:  # Crossref/S2/WALS-verified related items
  - "William D. Reyburn, 'Cherokee Verb Morphology I' IJAL 19(3) 1953, DOI 10.1086/464216, JSTOR stable/1263004"
  - "Reyburn 'Cherokee Verb Morphology II' IJAL 19(4) 1953, DOI 10.1086/464231"
  - "Reyburn 'Cherokee Verb Morphology III' IJAL 20(1) 1954 pp.44-64, DOI 10.1086/464251 (fieldwork Qualla 1951-52)"
  - "Ernest Bender & Zellig S. Harris, 'The Phonemes of North Carolina Cherokee', IJAL 1946, DOI 10.1086/463882"
  - "William Cook, dissertation draft 'Morphology and Syntax of North Carolina Cherokee' — photocopy at American Philosophical Society, https://diglib.amphilsoc.org/node/669312 (snippet-level only; APS diglib bot-walled)"

conclusion: >
  No downloadable copy exists on any verified platform, and the citation itself is
  likely garbled or invented: it is absent from UNC's own complete official list of
  1946-1959 graduate work. If a 1950s Cherokee-morphology source is what the
  requester actually wants, it is almost certainly Reyburn's IJAL series (paywalled
  JSTOR; obtainable via ILL) — or Cook's APS-held dissertation draft.

if_pursuing_the_physical_copy: >
  UNC North Carolina Collection (Wilson Library) reference desk holds paper copies
  of most UNC theses; WorldCat OCLC lookup from a JS-capable browser opens ILL and
  HathiTrust bibliographic-API routes; ProQuest PQDT via a subscribing library.
