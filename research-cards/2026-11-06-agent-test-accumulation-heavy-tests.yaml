# ---- Findings (merged) ----
findings:
  - id: F1
    finding: "ANTIPATTERN CONFIRMED (heavy default suite): Google isolates large tests to build/release stages explicitly 'so as not to impact developer workflow'; the per-commit gate is small tests only (single process, no I/O; ~60s small-test ceiling in Google's own S/M/L regime)."
    tier: 1
    sources: [swe-book-ch11, goog-test-sizes-2010]
  - id: F2
    finding: "TIER MECHANISM is per-toolchain and documented: pytest registered markers + strict_markers (-m 'not slow'), Rust #[ignore]/-- --ignored, Gradle integrationTest suite, Maven Failsafe, Jest/Vitest projects, Go build tags. Heavy tests are opt-in everywhere; exclusion-from-default is the documented convention (pandas ships the canonical marker string: 'not slow and not network and not db and not single_cpu')."
    tier: 1
    sources: [pytest-markers, rust-ignore, pandas-markers, gradle-int-suite]
  - id: F3
    finding: "TAXONOMY: pyramid (Cohn/Vocke) — unit/service(UI); fewer tests per higher level; E2E reduced 'to a bare minimum'; Google's orthogonal size-vs-scope grid (small/medium/large × narrow/medium/broad, 80/15/5 mix); subcut tests test end-to-end behavior just under the UI; contract tests guard third-party seams where doubles would lie. Terminology is NOT unified — both Vocke and Fowler 2021 say the community hasn't settled terms; no 'SmokeTest' bliki exists (verified 404)."
    tier: 2
    sources: [vocke-pyramid, swe-book-ch11, fowler-subcut, fowler-tags]
  - id: F4
    finding: "SMOKE = operational 'does the SUT start and its critical path work' (Google: 'If the SUT starts successfully, the test passes'; probers = production smoke; Vocke: 1-2 core user journeys; Shore: 'one or two end-to-end tests that make sure your code starts up and runs a common workflow'; VS Code ships a separate sharded test/smoke suite as its release gate; K8s probes budget health checks in seconds). No universal smoke-duration number exists in any fetched primary source — the documented granularity is seconds-vs-minutes (unit=ms per Microsoft playbook; 'slow' = 'seconds rather than milliseconds' per pandas)."
    tier: 2
    sources: [swe-book-ch14, vocke-pyramid, shore-twm, vscode-smoke]
  - id: F5
    finding: "REGRESSION SUITE = accumulated story/bug tests (Fowler); 'correct granularity' = push tests as far down the pyramid as possible; when a high-level test fails, add the missing lower-level test; integration tests live at serialize/deserialize seams; assert only what lower levels couldn't cover."
    tier: 2
    sources: [fowler-tags, vocke-pyramid]
  - id: F6
    finding: "RUN-THE-REAL-CODE ANCHOR (strongest evidence): SWE-book ch13 — real implementations are the first choice, 'higher fidelity when they execute code as it will be executed in production', mocking-framework overuse 'rarely finding bugs' with 'constant effort', interaction testing validates calls not behavior; Fowler — mockist tests 'run green but mask inherent errors', real objects if possible; Shore — state-based tests over interaction-based, real files/databases, overlapping sociable tests run real dependency chains; Spotify honeycomb — 'the Microservice has become our new Unit', real DB + real API per test; Testcontainers/Pact/Playwright document the real-service/real-browser mechanisms with mocks as opt-in."
    tier: 2
    sources: [swe-book-ch13, fowler-mocks, shore-twm, spotify-honeycomb, testcontainers, pact]
  - id: F7
    finding: "AGENT-RUN ANCHOR (vendor-confirmed): Anthropic's long-running-agents post — unit tests + curl 'against a development server' is insufficient; explicitly prompting full end-to-end verification with browser automation 'as a human user would' 'dramatically improved performance', surfacing bugs 'not obvious from the code alone'; OpenAI Codex docs — 're-run the repro steps after the fix' and 'run lint + the smallest relevant test suite' (repro-run vs minimal suite distinct); Claude Code workflows — 'tell Claude the command to reproduce the issue', 'run the new tests and fix any failures'; Aider /run shares real program output into the loop; hooks make run-on-edit non-optional."
    tier: 2
    sources: [anthropic-harness, codex-prompting, cc-workflows, aider-lint-test, cc-hooks]
  - id: F8
    finding: "LIGHT-DEFAULT / HEAVY-ON-DEMAND POLICY (supported): Böckeler's lifecycle split — fast controls pre-commit, expensive ones (mutation testing, broad review) post-integration only; Aider's per-file-recompile vs full-rebuild tiers; Codex's 'smallest relevant test suite' wording; Rust's --ignored on demand 'when you have time to wait'; pandas' marker-excluded default; Next.js 'very fast' unit tier default with isolated e2e scripts."
    tier: 2
    sources: [boeckeler-harness, aider-lint-test, codex-prompting, rust-ignore, pandas-markers, nextjs-testing]
  - id: F9
    finding: "NO public vendor/framework standard defines marker tags like 'validation-only'/'ephemeral' for agent-generated tests, nor an explicit test-promotion human checkpoint — verified absent from Claude Code docs, Codex docs, Cursor rules docs, and practitioner posts (2026-11-06). Nearest precedent for governing agents' edits to existing tests: Anthropic's test-tamper rule ('It is unacceptable to remove or edit tests...'). A lifecycle vocabulary here would be novel-but-grounded: tiering evidence is strong, the ticket-scoped lifecycle is team policy territory (deck governance)."
    tier: 2
    sources: [anthropic-tamper]
  - id: F10
    finding: "MUTATION TESTING as the presence-vs-value countermeasure: coverage only measures execution, 'not that your tests are actually able to detect faults' — mutation score is 'the gold standard' check on agent-authored suites; positioned as post-integration/scheduled, never default-gate (Böckeler)."
    tier: 2
    sources: [pitest, boeckeler-harness]
  - id: FA
    finding: "RESTORED (pass-1). BLOAT/ACCUMULATION: practitioner sources measure test-folder bloat ('Test folders bloat faster than source folders in most repositories using assistants'; 'the same mock setup pasted into a dozen test files'), redundant branch-per-input tests ('a bloated test suite with no real coverage gain'), and dedup-blindness ('assessors contribute additional tests that resemble existing ones without recognizing that the behavior has already been verified elsewhere'). Cross-session per-ticket accrual stays ANECDOTAL (gaps)."
    sources: [toolversus, proandroid, testing-mag]
  - id: FB
    finding: "RESTORED (pass-1). LOW-VALUE OBSERVATIONAL: agent-written tests serve as observation channels — print statements dominate assertion checks (practitioner print:assertion ratio 4.8:1), test-writing frequency does not distinguish resolved from unresolved tasks within the same model, prompt-induced test-volume changes do not alter outcomes, GPT-5.2 writes almost no tests yet matches top agents."
    sources: [arxiv-value, codex-practice]
  - id: FC
    finding: "RESTORED (pass-1). FLAKINESS/DEBT: 204,673-test-artifact study (AIDev dataset) — agent-generated files flakier than human ones (candidate rate 0.41 vs 0.30, driven by file-I/O and non-determinism) and framed as 'stealth technical debt' — suites that pass without semantic value."
    sources: [arxiv-debt]

# ---- Card-ready material (draft anchors for the eventual governed artifact) ----
card_ready_material:
  target_options:
    - "programming-principles card update (description should add: reference when creating SPECs and PLANs so SC-matching tests are marked by tier — description-level hook per floor's match-your-intent rule)"
    - "dedicated test-tier skill card owned by/adjacent to programming-principles"
  rewrite_surfaces_in_deck:
    - ".opencode/skills/implement/SKILL.md L32 — 'Test tiers: smoke + regression are the default for every cycle and PR' (needs the validation-only class added)"
    - ".opencode/skills/implement/references/implementation-workflow.md tier table + suite-green row (smoke, regression, full-suite rows; needs on-demand/heavy tier and marker-on-creation discipline)"
    - "systematic-debugging #5 ('Add the failing case as a behavioral test') — needs a tier/disposition tag"
  draft_anchors:
    - name: run-real-code
      anchor: "Verify the updated code path by executing the real implementation (repro command, real dependencies, real app boot); test suites and mock-interaction reads are secondary evidence, never the only evidence. Mocks are the fallback for awkward/dangerous collaborators only."
      sources: [anthropic-harness, swe-book-ch13, fowler-mocks, shore-twm]
    - name: mark-on-creation
      anchor: "Every test an agent writes is classified at write time and carries its tier marker: ephemeral (scratch observation, never committed as a test file), pr-validation (proves this PR for this ticket; runs at PR-check only; dispositioned promote/consolidate/retire at merge), smoke (default always-run; SUT-starts + critical path; seconds-scale), regression (changed-area coverage; default gate), heavy-regression (permitted, opt-in only: marker-excluded from the default run; scheduled/on-demand)."
      sources: [pandas-markers, rust-ignore, vocke-pyramid, fowler-tags]
    - name: light-default
      anchor: "The always-run gate (pre-commit + PR) stays in seconds-to-low-minutes: unit + smoke + changed-area regression. Full suite, benchmarks, mutation testing, broad e2e: release boundaries, scheduled jobs, or explicit developer request."
      sources: [swe-book-ch11, boeckeler-harness, ms-playbook(pass1)]
    - name: granularity
      anchor: "Push verification as far down the tiers as the change allows; a heavier-tier test earns its place only when lower tiers cannot reach the behavior; ticket-scoped PR-validation tests are not promoted by default — promotion is an explicit reviewer decision."
      sources: [vocke-pyramid, swe-book-ch13]
    - name: no-test-tampering
      anchor: "Agents may not delete or edit pre-existing tests to make gates pass (Anthropic precedent); disposition of any existing test changed by agent work is stated in the PR."
      sources: [anthropic-tamper]
  novelty_flag: "The ephemeral/pr-validation marker vocabulary is novel (F9); tiering, run-real-code, light-default, and granular-evidence anchors are industry-grounded and vendor-confirmed (F6-F8)."

