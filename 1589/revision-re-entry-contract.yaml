spec: https://github.com/michael-conrad/.opencode/issues/1589
revision_re_entry:
  revision_scopes:
    - scope: full
      cascade_artifacts:
        - plan.md
        - sc-summary.yaml
        - verification-consistency-contract.yaml
      requires_re_approval: true
      valid_re_entry_steps:
        - step: pre-response-gate-reentry
        - step: gap-fill-dispatch-next
        - step: behavioral-test
      constraints:
        - 'on_partial_revision: cascade_is_limited_to_affected_scs'
        - 'on_full_revision: all_artifacts_must_be_regenerated'
