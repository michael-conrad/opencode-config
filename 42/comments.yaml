  body: "### Clarification on Change 11: Language Preference \u2014 PURGE, not relocate\n\
    \nThe `<LANGUAGE_PREFERENCE>` block is **purged entirely**, not moved to an instruction\
    \ file. It doesn't work correctly \u2014 glm-5.1 still outputs Chinese despite\
    \ the injection. Removing it, not relocating it.\n\nChange 11 updated: Remove\
    \ `buildLanguagePreferenceBlock()` completely. No replacement in instruction file,\
    \ no replacement anywhere.\n\n\U0001F916 Co-authored with AI: OpenCode (ollama-cloud/glm-5)"
