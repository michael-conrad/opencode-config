  body: "Superseded by michael-conrad/.opencode#404\n\nThis spec targets files in\
    \ the `.opencode/` submodule (`michael-conrad/.opencode`). Filing it against `opencode-config`\
    \ was incorrect per the repository's AGENTS.md sub-folder repo mapping rules.\n\
    \nThe new spec includes:\n- Build mode critical mandate at the top\n- Full 13-change\
    \ approach from dual adversarial audit + developer review\n- Correct architecture:\
    \ verbatim injection, no regex parsing, Markdown instead of XML\n\n\U0001F916\
    \ Co-authored with AI: OpenCode (ollama-cloud/glm-5)"
