title: '[SPEC-FIX] session-init output fixes: reorder session-started first, add stale
  training data warning, remove git branch'
status: open
labels:
- needs-approval
- SPEC-FIX
body: '> **Full spec and artifacts: [`.issues/357/`](https://github.com/michael-conrad/opencode-config/tree/issues-data/357)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.issues/357/` — implementation plan, card catalogue, dependency
  contracts, research, designs, audit findings


  ## Objective


  Fix three output defects in the `session-init` tool: reorder "Session started" to
  be the first line, add a stale training data warning, and remove the redundant "Git
  branch" line.


  ## Background


  The `session-init` tool (`.opencode/tools/session-init`) emits session context consumed
  by AI agents at session start. Three defects were identified:


  1. **"Session started" is not the first line** — The session timestamp is currently
  the 4th line (after Developer, Email, Git branch). Per issue #2146, it should be
  the first line to establish temporal context immediately.

  2. **Missing stale training data warning** — The principle that "training data is
  stale, memory is unreliable" is documented in `.opencode/guidelines/065-verification-honesty.md`
  and `.opencode/prompts/default.txt` line 189, but `session-init` does not emit any
  such warning.

  3. **"Git branch" line should be removed** — Branch info is redundant with the env-loader
  pipeline''s `BRANCH_NAME` variable and is not a structured key:value pair. The agent
  can get branch context from git directly.


  ## Not Included


  - Changes to env-loader.ts (separate pipeline)

  - Changes to the "Session started" format itself

  - Changes to any other session-init output sections (## CLI Auth Status, ## Local
  Issue Folders, ## Repo Information, ## Agent Tools)

  - Changes to guard checks, credential warnings, or worktree/hooks output


  ## Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1 | `Session started:` line is the first line of session-init stdout output
  (before Developer, Email, or any other content) | `string` | Run `uv run .opencode/tools/session-init`,
  capture stdout, assert first line starts with "Session started:" |

  | SC-2 | A `Warning:` or `Note:` line about training data staleness appears in session-init
  output, positioned within the first 5 lines | `string` | Capture stdout, grep for
  "training data" or "stale" or "memory" warning text within first 5 lines |

  | SC-3 | The `Git branch:` line is removed from session-init output | `string` |
  Capture stdout, verify "Git branch" does not appear |

  | SC-4 | All existing output sections (Developer, Email, CLI Auth Status, Local
  Issue Folders, Repo Information, project_root, Agent Tools) are preserved in the
  output | `string` | grep for each section header and key:value pair |

  | SC-5 | The `Session started:` format (day-of-week, date, time, timezone abbreviation)
  is preserved per issue #2146 | `string` | Verify "Session started" line matches
  natural English prose pattern with tz abbreviation |


  ## Requirements


  1. The `Session started:` line SHALL be the first line of stdout output from `session-init`.

  2. A stale training data warning SHALL appear within the first 5 lines of stdout
  output.

  3. The `Git branch:` line SHALL NOT appear in stdout output.

  4. All existing output sections (Developer, Email, ## CLI Auth Status, ## Local
  Issue Folders, ## Repo Information, project_root, ## Agent Tools) SHALL remain present
  and unchanged.

  5. The `Session started:` format string SHALL remain `{now.strftime(''%A, %B %d,
  %Y at %I:%M %p'')} {now.tzname()}`.


  ## Items


  | Item | SC | Description |

  |------|----|-------------|

  | 1 | SC-1 | Move "Session started" print to first output position |

  | 2 | SC-2 | Add stale training data warning after "Session started" line |

  | 3 | SC-3 | Remove "Git branch" print statement |

  | 4 | SC-4 | Verify all other sections are preserved (no-op change) |

  | 5 | SC-5 | Verify "Session started" format is unchanged (no-op change) |


  ## Dependencies


  - `.opencode/guidelines/065-verification-honesty.md` — Source of stale training
  data concept

  - `.opencode/prompts/default.txt` line 189 — Canonical warning text: "Training data
  is stale, memory is unreliable"

  - `.opencode/.issues/2146/spec.md` — Defined "Session started" format


  ## Traceability


  | Requirement | SCs | Phase |

  |-------------|-----|-------|

  | R1 | SC-1 | 1 |

  | R2 | SC-2 | 1 |

  | R3 | SC-3 | 1 |

  | R4 | SC-4 | 1 |

  | R5 | SC-5 | 1 |

